<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>敲我的頭！</title>
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #ffe6e6, #fff5f5);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .card {
      background: white;
      padding: 28px;
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.12);
      text-align: center;
      max-width: 420px;
      width: 92%;
    }

    h1 { margin-top: 0; color: #ff4d6d; }

    #gameArea {
      position: relative;
      height: 280px;
      background: #fff0f3;
      border-radius: 16px;
      overflow: hidden;
      margin: 18px 0;
      touch-action: manipulation;
    }

    .target {
      position: absolute;
      width: 64px;
      height: 64px;
      cursor: pointer;
      user-select: none;
      transition: transform 0.12s ease;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 6px 14px rgba(0,0,0,0.25);
    }

    .target:active { transform: scale(0.9); }

    .shake {
      animation: shake 0.3s;
    }

    @keyframes shake {
      0% { transform: translateX(0); }
      25% { transform: translateX(-4px); }
      50% { transform: translateX(4px); }
      75% { transform: translateX(-4px); }
      100% { transform: translateX(0); }
    }

    .floatText {
      position: absolute;
      font-weight: bold;
      color: #ff2d55;
      pointer-events: none;
      animation: floatUp 0.8s ease forwards;
    }

    @keyframes floatUp {
      from { opacity: 1; transform: translateY(0); }
      to { opacity: 0; transform: translateY(-40px); }
    }

    button {
      background: #ff4d6d;
      border: none;
      color: white;
      padding: 12px 24px;
      border-radius: 999px;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(255,77,109,0.4);
    }

    #message {
      margin-top: 14px;
      font-weight: bold;
      color: #d6336c;
      min-height: 24px;
      white-space: pre-line;
    }

    /* 獎勵彈窗 + 刮刮樂 */
    #reward {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 999;
    }

    .rewardCard {
      background: white;
      padding: 32px;
      border-radius: 24px;
      text-align: center;
      max-width: 320px;
      width: 85%;
      box-shadow: 0 30px 80px rgba(0,0,0,0.25);
      position: relative;
    }

    #scratchCanvas {
      position: absolute;
      top: 0;
      left: 0;
      border-radius: 16px;
      cursor: pointer;
    }

  </style>
</head>
<body>
  <div class="card">
    <h1>敲我的頭 😝</h1>
    <p>只准敲「是我」的照片！敲錯會扣分喔～</p>

    <div id="gameArea"></div>

    <div>分數：<span id="score">0</span></div>
    <br />
    <button onclick="startGame()">開始遊戲</button>

    <div id="message"></div>
  </div>

  <!-- 獎勵刮刮樂彈窗 -->
  <div id="reward">
    <div class="rewardCard">
      <h2 id="rewardTitle">🎁</h2>
      <p id="rewardText"></p>
      <canvas id="scratchCanvas"></canvas>
      <button onclick="closeReward()">收下 ❤️</button>
    </div>
  </div>

  <audio id="hitSound" src="https://cdn.jsdelivr.net/gh/jshawl/AudioFX/sounds/pop.mp3"></audio>

  <script>
    const gameArea = document.getElementById('gameArea');
    const scoreEl = document.getElementById('score');
    const messageEl = document.getElementById('message');
    const rewardBox = document.getElementById('reward');
    const rewardTitle = document.getElementById('rewardTitle');
    const rewardText = document.getElementById('rewardText');
    const hitSound = document.getElementById('hitSound');
    const scratchCanvas = document.getElementById('scratchCanvas');

    let score = 0;
    let gameTimer = null;
    let spawnTimer = null;

    const images = [
      { src: 'TSAI.jpg', type: 'good' },
      { src: 'DSC0031.jpg', type: 'good' },
      { src: 'ENN00228.JPG', type: 'bad' },
      { src: '0011.jpg', type: 'bad' }
    ];

    function startGame() {
      score = 0;
      scoreEl.textContent = score;
      messageEl.textContent = '';
      gameArea.innerHTML = '';

      clearInterval(gameTimer);
      clearInterval(spawnTimer);

      spawnTimer = setInterval(spawnTarget, 480);

      gameTimer = setTimeout(() => {
        clearInterval(spawnTimer);
        endGame();
      }, 20000);
    }

    function spawnTarget() {
      const pick = images[Math.floor(Math.random() * images.length)];

      const el = document.createElement('img');
      el.className = 'target';
      el.src = pick.src;
      el.dataset.type = pick.type;

      const x = Math.random() * (gameArea.clientWidth - 64);
      const y = Math.random() * (gameArea.clientHeight - 64);
      el.style.left = x + 'px';
      el.style.top = y + 'px';

      el.onclick = () => {
        hitSound.currentTime = 0;
        hitSound.play().catch(()=>{});

        if (el.dataset.type === 'good') {
          score += 5;
          showFloat('+5 ❤️', x, y);
        } else {
          score -= 5;
          el.classList.add('shake');
          showFloat('-5 ❌', x, y);
        }

        scoreEl.textContent = score;
        el.remove();
      };

      gameArea.appendChild(el);
      setTimeout(() => el.remove(), 1100);
    }

    function showFloat(text, x, y) {
      const t = document.createElement('div');
      t.className = 'floatText';
      t.textContent = text;
      t.style.left = x + 'px';
      t.style.top = y + 'px';
      gameArea.appendChild(t);
      setTimeout(() => t.remove(), 800);
    }

    function endGame() {
      if (score >= 40) {
        openScratchReward();
      } else {
        messageEl.textContent = '差一點點～再玩一次嘛 🥺';
      }
    }

    function openScratchReward() {
      rewardBox.style.display = 'flex';
      rewardTitle.textContent = '中獎啦！！';
      rewardText.textContent = '滑動刮開看你的獎品';

      // 設定 canvas 大小
      const ctx = scratchCanvas.getContext('2d');
      scratchCanvas.width = rewardBox.clientWidth * 0.9;
      scratchCanvas.height = 120;
      ctx.fillStyle = '#cccccc';
      ctx.fillRect(0, 0, scratchCanvas.width, scratchCanvas.height);
      ctx.globalCompositeOperation = 'destination-out';

      let isDrawing = false;
      scratchCanvas.onmousedown = scratchCanvas.ontouchstart = e => isDrawing = true;
      scratchCanvas.onmouseup = scratchCanvas.ontouchend = e => isDrawing = false;
      scratchCanvas.onmousemove = scratchCanvas.ontouchmove = e => {
        if (!isDrawing) return;
        const rect = scratchCanvas.getBoundingClientRect();
        let x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
        let y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
        ctx.beginPath();
        ctx.arc(x, y, 15, 0, Math.PI * 2);
        ctx.fill();

        // 計算刮掉比例
        const imgData = ctx.getImageData(0,0,scratchCanvas.width,scratchCanvas.height).data;
        let cleared = 0;
        for(let i=3;i<imgData.length;i+=4){ if(imgData[i]===0) cleared++; }
        if(cleared / (scratchCanvas.width*scratchCanvas.height) > 0.5){
          alert('🎉 恭喜！你的獎品是：' + (score>=120?'菜菜帶你吃大餐！': score>=80?'蛋糕一份':'奶茶一杯'));
          closeReward();
        }
      };
    }

    function closeReward() {
      rewardBox.style.display = 'none';
    }
  </script>
</body>
</html>
